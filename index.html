<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Points Alert</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0b0f14;
            color: white;
            padding: 20px;
        }

        button {
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer;
            background: transparent;
            border: 2px solid #00e676;
            color: #00e676;
            border-radius: 6px;
        }

        button:hover {
            background: #00e676;
            color: #000;
        }

        /* Toast-style points alert */
        #pointsAlert {
            display: none;
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #121a14;
            border: 2px solid #00e676;
            border-radius: 10px;
            box-shadow: 0 0 18px rgba(0, 230, 118, 0.6);
            padding: 14px 18px;
            z-index: 9999;
            max-width: 280px;
            text-align: center;
            animation: fadeSlideIn 0.3s ease-out;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #pointsAlert .closeBtn {
            position: absolute;
            top: 6px;
            right: 10px;
            cursor: pointer;
            font-weight: bold;
            color: #aaa;
        }

        #pointsAlert .closeBtn:hover {
            color: white;
        }

        #pointsAlert .alertImage {
            display: none;
            max-width: 100%;
            margin-bottom: 10px;
            border-radius: 6px;
        }

        #pointsAlert .msg {
            display: block;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <h2>🎮 Points Alert</h2>

    <button id="earnBtn">Earn 20 Points</button>

    <div id="pointsAlert">
        <span class="closeBtn">×</span>
        <img class="alertImage" />
        <span class="msg"></span>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="./app.js"></script>

</body>

</html>
